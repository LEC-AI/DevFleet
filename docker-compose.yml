services:
  devfleet-api:
    build: ./backend
    container_name: devfleet-api
    ports:
      - "18801:18801"
    volumes:
      # Backend code (hot-reload in dev)
      - ./backend:/app

      # SQLite database — persisted on host
      - ./data:/app/data

      # Claude CLI binary + config — mounted from host
      - ${HOME}/.local/share/claude:/home/devfleet/.local/share/claude:ro
      - ${HOME}/.local/bin/claude:/usr/local/bin/claude:ro
      - ${HOME}/.claude:/home/devfleet/.claude
      - ${HOME}/.claude.json:/home/devfleet/.claude.json

      # Project directories the agents will work on — set DEVFLEET_PROJECTS_HOST
      # in .env to the folder holding your repos (see .env.example)
      - ${DEVFLEET_PROJECTS_HOST:-${HOME}/projects}:/workspace/projects
    environment:
      - DEVFLEET_DB=/app/data/devfleet.db
      - DEVFLEET_MAX_AGENTS=${DEVFLEET_MAX_AGENTS:-3}
      - DEVFLEET_PROJECTS_DIR=/workspace/projects
      - HOME=/home/devfleet
      - ANTHROPIC_BASE_URL=https://api.anthropic.com
      # Headless auth — `claude setup-token` on the host, then put it in .env.
      # Without it the agents fall back to the mounted ~/.claude login.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Night window — autonomous dispatch only burns quota overnight
      - DEVFLEET_NIGHT_ENABLED=${DEVFLEET_NIGHT_ENABLED:-true}
      - DEVFLEET_TZ=${DEVFLEET_TZ:-Europe/London}
      - DEVFLEET_NIGHT_START=${DEVFLEET_NIGHT_START:-21:00}
      - DEVFLEET_NIGHT_END=${DEVFLEET_NIGHT_END:-08:30}
      - DEVFLEET_DAY_START=${DEVFLEET_DAY_START:-09:00}
      # Path mapping: enter host paths in UI, auto-translated inside container
      # Format: DEVFLEET_PATH_MAP_N=HOST_PATH:CONTAINER_PATH
      - DEVFLEET_PATH_MAP_1=${DEVFLEET_PROJECTS_HOST:-${HOME}/projects}:/workspace/projects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  devfleet-ui:
    build: ./frontend
    container_name: devfleet-ui
    ports:
      - "3101:80"
    depends_on:
      - devfleet-api
    restart: unless-stopped
